# xsy.test 本地开发环境Nginx配置
# 请将此配置添加到您的Nginx配置文件中（如nginx.conf或conf.d目录下的配置文件）

# 后端API和后台管理系统
server {
    listen 80;
    server_name xsy.test;
    
    # 修改为您的后端项目public目录的绝对路径
    root C:/Users/Administrator/Desktop/模板/后端/xsy.duodao/public;
    index index.php index.html;
    
    # 字符集
    charset utf-8;
    
    # 日志
    access_log C:/Users/Administrator/Desktop/模板/后端/xsy.duodao/runtime/logs/xsy_test_access.log;
    error_log C:/Users/Administrator/Desktop/模板/后端/xsy.duodao/runtime/logs/xsy_test_error.log;
    
    # ThinkPHP伪静态重写规则 - 关键配置！
    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=/$1 last;
        }
    }
    
    # PHP处理
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    
    # 禁止访问.htaccess文件
    location ~ /\.ht {
        deny all;
    }
    
    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# H5前端（如果需要单独配置）
# 如果您的H5部署在后端public/h5目录下，需要添加以下配置：
server {
    listen 80;
    server_name h5.xsy.test;
    
    # 修改为您的H5构建产物的绝对路径
    # 需要先执行：cd 前端/xisnhangye-text-app && npm run build:h5
    root C:/Users/Administrator/Desktop/模板/前端/xisnhangye-text-app/unpackage/dist/h5;
    index index.html;
    
    charset utf-8;
    
    # SPA路由回退 - 支持History模式
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
